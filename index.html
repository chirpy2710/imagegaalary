<!DOCTYPE html>
<html>
<head>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script>
AFRAME.registerComponent('controller-grab', {
  init: function () {
    this.grabbed = null;
  },

  tick: function () {

    let gamepads = navigator.getGamepads();
    if (!gamepads[0]) return;

    let trigger = gamepads[0].buttons[0].pressed;

    if (trigger && !this.grabbed) {
      let cube = document.querySelector("#cube");
      this.grabbed = cube;
      this.el.appendChild(cube);
      cube.setAttribute("position","0 -0.2 -0.5");
    }

    if (!trigger && this.grabbed) {
      document.querySelector("a-scene").appendChild(this.grabbed);
      this.grabbed = null;
    }
  }
});
</script>

</head>

<body>

<a-scene>

<a-box id="cube"
       position="0 1.5 -3"
       color="red">
</a-box>

<a-plane rotation="-90 0 0"
         width="10"
         height="10"
         color="#7BC8A4">
</a-plane>

<a-camera position="0 1.6 0" controller-grab></a-camera>

</a-scene>

</body>
</html>
