<!DOCTYPE html>
<html>
<head>
  <title>A-Frame 360 Gallery - TECHXR Controller</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <script>
    // Change scene when trigger pressed on hotspot
    AFRAME.registerComponent('controller-change-scene', {
      init: function () {

        this.el.addEventListener('triggerdown', () => {

          let intersectedEls = this.el.components.raycaster.intersectedEls;

          if (intersectedEls.length > 0) {
            let target = intersectedEls[0].getAttribute('data-target');
            if (target) {
              document.querySelector('#sky').setAttribute('src', target);
            }
          }

        });
      }
    });
  </script>
</head>

<body style="margin:0; overflow:hidden;">

<a-scene>

  <!-- Load LOCAL images -->
  <a-assets>
    <img id="img1" src="img1.jpg">
    <img id="img2" src="img2.jpg">
    <img id="img3" src="img3.jpg">
  </a-assets>

  <!-- Camera -->
  <a-camera position="0 1.6 0"></a-camera>

  <!-- TECHXR Right Controller -->
  <a-entity
      id="rightHand"
      laser-controls="hand: right"
      raycaster="objects: .clickable; showLine: true"
      controller-change-scene>
  </a-entity>

  <!-- 360 Sky -->
  <a-sky id="sky" src="#img1" rotation="0 -90 0"></a-sky>

  <!-- Hotspot 1 -->
  <a-circle class="clickable"
            position="-2 1.5 -3"
            radius="0.3"
            color="red"
            data-target="#img1">
  </a-circle>

  <a-text value="Living Room"
          position="-2 2.1 -3"
          color="white"
          align="center"
          width="3">
  </a-text>

  <!-- Hotspot 2 -->
  <a-circle class="clickable"
            position="0 1.5 -3"
            radius="0.3"
            color="blue"
            data-target="#img2">
  </a-circle>

  <a-text value="Kitchen"
          position="0 2.1 -3"
          color="white"
          align="center"
          width="3">
  </a-text>

  <!-- Hotspot 3 -->
  <a-circle class="clickable"
            position="2 1.5 -3"
            radius="0.3"
            color="green"
            data-target="#img3">
  </a-circle>

  <a-text value="Bedroom"
          position="2 2.1 -3"
          color="white"
          align="center"
          width="3">
  </a-text>

</a-scene>

</body>
</html>
