<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TechXR Grab & Drop</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/aframe/1.4.2/aframe.min.js"></script>
</head>
<body>

<a-scene>

  <!-- Camera -->
  <a-entity id="rig" position="0 1.6 0">

    <a-camera look-controls>
      <!-- Gaze cursor fallback (if no controller) -->
      <a-cursor
        id="gaze-cursor"
        raycaster="objects: .grabbable; far: 5"
        fuse="false"
      ></a-cursor>
    </a-camera>

    <!-- Right controller -->
    <a-entity
      id="right-ctrl"
      laser-controls="hand: right"
      raycaster="objects: .grabbable; far: 5; showLine: true"
      grab-drop
    ></a-entity>

    <!-- Left controller -->
    <a-entity
      id="left-ctrl"
      laser-controls="hand: left"
      raycaster="objects: .grabbable; far: 5; showLine: true"
      grab-drop
    ></a-entity>

  </a-entity>

  <!-- Floor -->
  <a-plane position="0 0 -3" rotation="-90 0 0"
           width="6" height="6" color="#222"></a-plane>

  <!-- Grabbable Cubes -->
  <a-box class="grabbable" id="cube1"
         position="-1 1 -3" width="0.4" height="0.4" depth="0.4"
         color="red"></a-box>

  <a-box class="grabbable" id="cube2"
         position="0 1 -3" width="0.4" height="0.4" depth="0.4"
         color="blue"></a-box>

  <a-box class="grabbable" id="cube3"
         position="1 1 -3" width="0.4" height="0.4" depth="0.4"
         color="green"></a-box>

  <a-sky color="#111"></a-sky>

</a-scene>

<script>
AFRAME.registerComponent('grab-drop', {

  init() {
    this.held     = null;
    this.prevParent = null;

    this.el.addEventListener('triggerdown', () => this.tryGrab());
    this.el.addEventListener('triggerup',   () => this.drop());
    this.el.addEventListener('gripdown',    () => this.tryGrab());
    this.el.addEventListener('gripup',      () => this.drop());
  },

  tryGrab() {
    if (this.held) return;

    const hits = this.el.components.raycaster.intersectedEls;
    if (!hits.length) return;

    const target = hits[0];
    if (!target.classList.contains('grabbable')) return;

    // Grab it
    this.held       = target;
    this.prevParent = target.parentNode;

    this.el.appendChild(target);
    target.setAttribute('position', '0 0 -0.6');
  },

  drop() {
    if (!this.held) return;

    const cube = this.held;

    // Get world position
    const wp = new THREE.Vector3();
    cube.object3D.getWorldPosition(wp);

    // Return to scene
    this.prevParent.appendChild(cube);
    cube.setAttribute('position', `${wp.x.toFixed(2)} ${wp.y.toFixed(2)} ${wp.z.toFixed(2)}`);

    this.held       = null;
    this.prevParent = null;
  }

});
</script>

</body>
</html>
