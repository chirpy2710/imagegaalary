<!DOCTYPE html>
<html>
<head>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
</head>

<body>

<a-scene>

<a-box position="0 1.6 -3" color="red"></a-box>

<a-plane rotation="-90 0 0"
         width="10"
         height="10"
         color="#7BC8A4">
</a-plane>

<!-- Controller with visible ray -->
<a-entity id="controller"
          position="0 1.6 0"
          raycaster="objects: a-box"
          line="color: green; opacity: 1"
></a-entity>

<a-camera></a-camera>

</a-scene>

</body>
</html>
