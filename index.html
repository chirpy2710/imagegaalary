<!DOCTYPE html>
<html>
<head>
<script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

<script>
AFRAME.registerComponent("ray-test",{
 init:function(){

  this.el.addEventListener("raycaster-intersection",function(e){
     e.detail.els[0].setAttribute("color","yellow")
  })

  this.el.addEventListener("raycaster-intersection-cleared",function(e){
     document.querySelector("#cube").setAttribute("color","red")
  })

 }
})
</script>

</head>

<body>

<a-scene>

<a-box id="cube"
       position="0 1.6 -3"
       color="red"
       class="clickable">
</a-box>

<a-plane rotation="-90 0 0"
         width="10"
         height="10"
         color="#7BC8A4">
</a-plane>

<a-entity id="controller"
          laser-controls
          raycaster="objects: .clickable"
          line="color:green"
          ray-test>
</a-entity>

<a-camera position="0 1.6 0"></a-camera>

</a-scene>

</body>
</html>
