<!DOCTYPE html>

<html>
<head>
  <meta charset="utf-8">
  <title>A-Frame Grab Cube</title>

  <!-- A-Frame -->

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- Super Hands for grab interaction -->

  <script src="https://unpkg.com/super-hands@4.0.5/dist/super-hands.min.js"></script>

</head>

<body>

<a-scene>

  <!-- Camera -->

<a-entity camera position="0 1.6 0" look-controls></a-entity>

  <!-- VR Controllers -->

<a-entity laser-controls="hand: left"
         super-hands
         raycaster="objects: .grabbable"> </a-entity>

<a-entity laser-controls="hand: right"
         super-hands
         raycaster="objects: .grabbable"> </a-entity>

  <!-- Floor -->

<a-plane rotation="-90 0 0" width="10" height="10" color="#7BC8A4"></a-plane>

  <!-- Cube to grab -->

<a-box class="grabbable"
      position="0 1 -1"
      depth="0.3"
      height="0.3"
      width="0.3"
      color="red"
      grabbable
      draggable
      droppable> </a-box>

</a-scene>

</body>
</html>
